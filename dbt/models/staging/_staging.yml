version: 2

models:
  - name: stg_steam__prices
    description: One row per game per day from our own daily snapshots. Failed fetches removed.
    columns:
      - name: price_key
        description: appid + snapshot date. Proves we never stored the same game twice in a day.
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["priced", "no_price", "not_found"]
      - name: cut_percent
        description: Discount percent, 0 when not on sale.
        data_tests: [not_null]

  - name: stg_itad__price_log
    description: Every past Steam price change in Canada, from IsThereAnyDeal.
    columns:
      - name: appid
        data_tests: [not_null]
      - name: changed_at
        data_tests: [not_null]
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ["CAD"]

  - name: stg_steam__appdetails
    description: Store metadata per game, cleaned. is_adult = content descriptor 3 or 4.
    columns:
      - name: appid
        data_tests: [unique, not_null]
      - name: type
        description: >
          Should always be "game" (the game list asks Steam for games only), but real data
          had one exception. Warn instead of fail; dim_games excludes non-games from modelling.
        data_tests:
          - accepted_values:
              arguments:
                values: ["game"]
              config:
                severity: warn
